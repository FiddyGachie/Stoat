        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/journal/transactions/{id}/reverse:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    post:
      summary: Post a reversing entry for a journal transaction
      description: >-
        Operator or supervisor sessions only; a reason of 1 to 500 characters is required. The server
        swaps every line of the original; the amount is never taken from the request. Re-checks the
        wallet balance and lifts a balance_mismatch block when derived equals stored.
        409 ALREADY_REVERSED when the transaction was reversed before.
      operationId: reverseJournalTransaction
      requestBody:
        required: true
