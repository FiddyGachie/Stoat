        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/reconciliation/runs/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      summary: One reconciliation run with its exceptions
      description: Operator or supervisor sessions only.
      operationId: getReconciliationRun
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRun" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/reconciliation/exceptions:
