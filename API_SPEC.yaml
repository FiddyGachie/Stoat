                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  # ── Legacy budgets: the debit route is deprecated and money-inert ─────────
  /budgets/{budgetId}:
    parameters:
      - {
          name: budgetId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      summary: Edit a budget still waiting for PayPal approval
      description: >-
        Human owner or Admin only (agents get 403). Stoat first checks PayPal; if the buyer already
        approved the order the budget activates and the edit is refused (409 BUDGET_ALREADY_APPROVED).
        Otherwise a new PayPal order is created with the new terms and the old budget is cancelled
        and hidden. If PayPal cannot create the new order, the old budget is left unchanged.
      operationId: editPendingBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string, description: "Decimal string greater than 0" }
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }
                mission_id: { type: string, format: uuid, nullable: true }
      responses:
        "200": { description: "The new budget and the retired one ({ budget, replaced })" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Delete a budget PayPal never approved
      description: >-
        Human owner or Admin only. The budget is cancelled and hidden from the list (GET
        /v1/budgets?status=cancelled still shows it); its events are kept. Refused with 409 when
        PayPal reports the order approved, or 503 BUDGET_PAYPAL_UNVERIFIED when PayPal cannot be
        reached. An order PayPal no longer knows (expired) can be deleted.
      operationId: deletePendingBudget
      responses:
        "200": { description: "{ budget, deleted: true }" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /budgets/{budgetId}/sync:
    parameters:
      - {
          name: budgetId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Check PayPal for a budget pending approval and activate it if the buyer approved
      description: >-
        Human buyer or operator only (agents get 403). Stoat reads the order at PayPal; only an
        APPROVED or COMPLETED order is captured and reconciled, and the budget becomes active.
        Otherwise the budget is returned unchanged. Idempotent. The PayPal return handler and a
        30-second sweep do the same automatically.
      operationId: syncBudget
      responses:
        "200": { description: "The budget after the check" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /budgets/{budgetId}/debit:
    parameters:
      - {
          name: budgetId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      deprecated: true
      summary: DEPRECATED - debits nothing; charges arise only from verified obligations
      description: >-
        Only the budget's human Owner may call it. It never debits and never changes a balance.
        Every success carries `Deprecation: true` and `Sunset: Thu, 31 Dec 2026 23:59:59 GMT`.
        An agent principal, or a person who is not the Owner, gets 403 FORBIDDEN_ACTION and one audit
        row. A body containing `amount` is 400 VALIDATION_FAILED. Unknown budget is 404.
      operationId: debitBudgetDeprecated
      responses:
        "200":
          description: Acknowledgement that nothing was debited
          headers:
            Deprecation: { schema: { type: string, example: "true" } }
            Sunset: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [deprecated, debited, message]
                properties:
                  deprecated: { type: boolean, const: true }
                  debited: { type: boolean, const: false }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 200 characters. Repeating a request with the same key and body returns the first result; the same key with a different body is 409 IDEMPOTENCY_CONFLICT. A missing or out-of-range key is 400 VALIDATION_FAILED.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's next_cursor. An invalid cursor is 400 VALIDATION_FAILED.
      schema: { type: string, maxLength: 500 }
  schemas:
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Money as a decimal string, never a JSON number. May be negative only where a signed figure is stated (statement lines, differences).
      examples: ["0", "12.50"]
    PayPalEnvironment:
      type: string
      enum: [sandbox, live]
    FundingMode:
      type: string
      enum: [direct, wallet]
    FundingModeResponse:
      type: object
      required: [funding_mode]
      properties:
        funding_mode: { $ref: "#/components/schemas/FundingMode" }
    Wallet:
      type: object
      required:
        [
          id,
          currency,
          status,
          paypal_environment,
          balance,
          reserved,
          pending_refund,
          available,
          deposited,
          charged,
          refunded,
          funding_mode,
        ]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, description: "active or blocked" }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        balance: { $ref: "#/components/schemas/DecimalString" }
        reserved: { $ref: "#/components/schemas/DecimalString" }
        pending_refund: { $ref: "#/components/schemas/DecimalString" }
        available: { $ref: "#/components/schemas/DecimalString" }
        deposited: { $ref: "#/components/schemas/DecimalString" }
        charged: { $ref: "#/components/schemas/DecimalString" }
        refunded: { $ref: "#/components/schemas/DecimalString" }
        funding_mode: { $ref: "#/components/schemas/FundingMode" }
    WalletOverview:
      type: object
      required: [funding_mode, paypal_environment, wallets]
      properties:
        funding_mode: { $ref: "#/components/schemas/FundingMode" }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        wallets: { type: array, items: { $ref: "#/components/schemas/Wallet" } }
    AdminWallet:
      type: object
      required:
        [
          id,
          owner_user_id,
          currency,
          status,
          paypal_environment,
          balance,
          reserved,
          pending_refund,
          available,
          deposited,
          charged,
          refunded,
          last_activity_at,
        ]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        currency: { type: string }
        status: { type: string }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        balance: { $ref: "#/components/schemas/DecimalString" }
        reserved: { $ref: "#/components/schemas/DecimalString" }
        pending_refund: { $ref: "#/components/schemas/DecimalString" }
        available: { $ref: "#/components/schemas/DecimalString" }
        deposited: { $ref: "#/components/schemas/DecimalString" }
        charged: { $ref: "#/components/schemas/DecimalString" }
        refunded: { $ref: "#/components/schemas/DecimalString" }
        last_activity_at: { type: [string, "null"], format: date-time }
    DepositRequest:
      type: object
      required: [amount, currency]
      description: Only these fields are read. wallet_id, owner_id, user_id and tenant_id are ignored; any payee, recipient, receiver or payment-source field is rejected with 400 VALIDATION_FAILED.
      properties:
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        mission_id: { type: [string, "null"], format: uuid }
    Deposit:
      type: object
      required:
        [
          id,
          wallet_id,
          mission_id,
          is_top_up,
          status,
          amount,
          currency,
          credited_amount,
          paypal_environment,
          paypal_order_id,
          approve_url,
          failure_reason,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        mission_id: { type: [string, "null"], format: uuid }
        is_top_up: { type: boolean }
        status:
          {
            type: string,
            description: "awaiting_approval, awaiting_capture, captured, failed, expired, cancelled or creation_failed",
          }
        amount: { $ref: "#/components/schemas/DecimalString" }
        currency: { type: string }
        credited_amount: { $ref: "#/components/schemas/DecimalString" }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        paypal_order_id: { type: [string, "null"] }
        approve_url:
          {
            type: [string, "null"],
            description: Present only while status is awaiting_approval.,
          }
        failure_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    MissionWallet:
      type: object
      required:
        [
          mission_id,
          title,
          mission_status,
          currency,
          budget,
          available,
          shortfall,
          reserved,
          charged,
          unreserved_funding,
          state,
        ]
      properties:
        mission_id: { type: string, format: uuid }
        title: { type: string }
        mission_status: { type: string }
        currency: { type: string }
        budget: { $ref: "#/components/schemas/DecimalString" }
        available: { $ref: "#/components/schemas/DecimalString" }
        shortfall: { $ref: "#/components/schemas/DecimalString" }
        reserved: { $ref: "#/components/schemas/DecimalString" }
        charged: { $ref: "#/components/schemas/DecimalString" }
        unreserved_funding: { $ref: "#/components/schemas/DecimalString" }
        state:
          {
            type: string,
            description: "For example funded, partially_funded, awaiting_decision, depleted, completed.",
          }
    RemainderPrompt:
      type: object
      required:
        [
          mission_id,
          paypal_environment,
          figures,
          advice,
          ai_generated,
          label,
          display_only,
        ]
      properties:
        mission_id: { type: string, format: uuid }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        figures:
          type: object
          required:
            [currency, budget, available, charged, reserved, shortfall, state]
          properties:
            currency: { type: string }
            budget: { $ref: "#/components/schemas/DecimalString" }
            available: { $ref: "#/components/schemas/DecimalString" }
            charged: { $ref: "#/components/schemas/DecimalString" }
            reserved: { $ref: "#/components/schemas/DecimalString" }
            shortfall: { $ref: "#/components/schemas/DecimalString" }
            state: { type: string }
        advice: { type: string }
        ai_generated: { type: boolean }
        label: { type: string }
        fallback_reason: { type: [string, "null"] }
        run_id: { type: [string, "null"] }
        model: { type: [string, "null"] }
        mode: { type: [string, "null"] }
        replayed: { type: [boolean, "null"] }
        schema_version: { type: [string, "null"] }
        display_only: { type: boolean, const: true }
    RefundItem:
      type: object
      required: [id, deposit_id, paypal_capture_id, amount, status, attempts]
      properties:
        id: { type: string, format: uuid }
        deposit_id: { type: string, format: uuid }
        paypal_capture_id: { type: string }
        amount: { $ref: "#/components/schemas/DecimalString" }
        status:
          {
            type: string,
            description: "planned, submitted, completed, pending or failed",
          }
        paypal_refund_id: { type: [string, "null"] }
        paypal_status: { type: [string, "null"] }
        failure_reason: { type: [string, "null"] }
        attempts: { type: integer, minimum: 0 }
    Refund:
      type: object
      required:
        [
          id,
          wallet_id,
          kind,
          amount,
          currency,
          status,
          paypal_environment,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        kind: { type: string, enum: [remainder, unlinked, admin] }
        mission_id: { type: [string, "null"], format: uuid }
        decision_id: { type: [string, "null"], format: uuid }
        amount: { $ref: "#/components/schemas/DecimalString" }
        currency: { type: string }
        status: { type: string }
        actor_user_id: { type: [string, "null"], format: uuid }
        actor_role: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        items:
          { type: array, items: { $ref: "#/components/schemas/RefundItem" } }
    RemainderDecision:
      type: object
      required:
        [
          id,
          mission_id,
          wallet_id,
          decision,
          remainder_amount,
          refund_amount,
          decided_by,
          decided_at,
          refund,
        ]
      properties:
        id: { type: string, format: uuid }
        mission_id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        decision: { type: string, enum: [refund, keep] }
        remainder_amount: { $ref: "#/components/schemas/DecimalString" }
        refund_amount: { $ref: "#/components/schemas/DecimalString" }
        decided_by: { type: string, format: uuid }
        decided_at: { type: string, format: date-time }
        refund:
          oneOf:
            - { $ref: "#/components/schemas/Refund" }
            - { type: "null" }
    Notification:
      type: object
      required: [id, kind, title, body, created_at, read_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        entity_type: { type: [string, "null"] }
        entity_id: { type: [string, "null"] }
        mission_id: { type: [string, "null"], format: uuid }
        link:
          {
            type: [string, "null"],
            description: Navigation only; never a state-changing URL.,
          }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
    EconomicEvent:
      type: object
      required:
        [
          id,
          aggregate_type,
          aggregate_id,
          sequence,
          event_type,
          actor_type,
          tenant_id,
          correlation_id,
          recorded_at,
        ]
      properties:
        id: { type: string, format: uuid }
        aggregate_type: { type: string }
        aggregate_id: { type: string, format: uuid }
        sequence: { type: integer }
        event_type: { type: string }
        actor_type: { type: string }
        actor_role: { type: [string, "null"] }
        actor_id: { type: [string, "null"] }
        tenant_id: { type: string, format: uuid }
        correlation_id: { type: string }
        amount:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/DecimalString" },
                { type: "null" },
              ],
          }
        currency: { type: [string, "null"] }
        recorded_at: { type: string, format: date-time }
        paypal_order_id: { type: [string, "null"] }
        paypal_capture_id: { type: [string, "null"] }
        paypal_refund_id: { type: [string, "null"] }
        paypal_payout_batch_id: { type: [string, "null"] }
        paypal_request_id: { type: [string, "null"] }
    StatementLine:
      type: object
      required: [kind, amount, currency, occurred_at]
      properties:
        id: { type: [string, "null"] }
        wallet_id: { type: string, format: uuid }
        kind:
          {
            type: string,
            enum: [deposit, charge, refund, reversal, adjustment],
          }
        description: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/DecimalString" }
        currency: { type: string }
        balance_after:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/DecimalString" },
                { type: "null" },
              ],
          }
        entity_type: { type: [string, "null"] }
        entity_id: { type: [string, "null"] }
        paypal_environment: { type: [string, "null"] }
        occurred_at: { type: string, format: date-time }
    Statement:
      type: object
      required:
        [wallet_id, currency, paypal_environment, balance, lines, next_cursor]
      properties:
        wallet_id: { type: [string, "null"], format: uuid }
        currency: { type: [string, "null"] }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        balance: { $ref: "#/components/schemas/DecimalString" }
        lines:
          { type: array, items: { $ref: "#/components/schemas/StatementLine" } }
        next_cursor: { type: [string, "null"] }
    UserAccount:
      type: object
      required: [user_id, wallets]
      properties:
        user_id: { type: string, format: uuid }
        wallets:
          type: array
          items:
            type: object
            required: [wallet, deposits, reservations, charges, refunds]
            properties:
              wallet: { $ref: "#/components/schemas/Wallet" }
              deposits:
                {
                  type: array,
                  items:
                    {
                      type: object,
                      additionalProperties: true,
                      description: "id, mission_id, status, amount, credited_amount, currency, paypal_order_id, paypal_capture_id, created_at",
                    },
                }
              reservations:
                {
                  type: array,
                  items:
                    {
                      type: object,
                      additionalProperties: true,
                      description: "id, mission_id, agreement_id, status, amount, currency, created_at",
                    },
                }
              charges:
                {
                  type: array,
                  items:
                    {
                      type: object,
                      additionalProperties: true,
                      description: "id, mission_id, obligation_id, amount, currency, created_at",
                    },
                }
              refunds:
                {
                  type: array,
                  items:
                    {
                      type: object,
                      additionalProperties: true,
                      description: "id, kind, status, amount, currency, paypal_refund_ids, created_at",
                    },
                }
    BusinessAccountRow:
      type: object
      required:
        [
          currency,
          paypal_funds_received,
          wallet_balance_held,
          funds_allocated_to_providers,
          provider_payouts_completed,
          refunds_completed,
          platform_revenue,
          wallet_balance_sum,
          difference,
        ]
      properties:
        currency: { type: string }
        paypal_funds_received: { $ref: "#/components/schemas/DecimalString" }
        wallet_balance_held: { $ref: "#/components/schemas/DecimalString" }
        funds_allocated_to_providers:
          { $ref: "#/components/schemas/DecimalString" }
        provider_payouts_completed:
          { $ref: "#/components/schemas/DecimalString" }
        refunds_completed: { $ref: "#/components/schemas/DecimalString" }
        platform_revenue: { $ref: "#/components/schemas/DecimalString" }
        wallet_balance_sum: { $ref: "#/components/schemas/DecimalString" }
        difference: { $ref: "#/components/schemas/DecimalString" }
    TrialBalanceRow:
      type: object
      required: [currency, total_debits, total_credits, difference, balanced]
      properties:
        currency: { type: string }
        total_debits: { $ref: "#/components/schemas/DecimalString" }
        total_credits: { $ref: "#/components/schemas/DecimalString" }
        difference: { $ref: "#/components/schemas/DecimalString" }
        balanced: { type: boolean }
    JournalReversal:
      type: object
      required: [original_transaction_id, reversal_transaction_id, wallets]
      properties:
        original_transaction_id: { type: string, format: uuid }
        reversal_transaction_id: { type: string, format: uuid }
        wallets:
          type: array
          items:
            type: object
            required: [wallet_id, status, block_lifted]
            properties:
              wallet_id: { type: string, format: uuid }
              status: { type: string }
              block_lifted: { type: boolean }
    ReconciliationException:
      type: object
      required: [id, item_type, paypal_id, kind, status, created_at, detail]
      properties:
        id: { type: string, format: uuid }
        item_type: { type: string }
        paypal_id: { type: string }
        kind: { type: string }
        currency: { type: [string, "null"] }
        stoat_amount:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/DecimalString" },
                { type: "null" },
              ],
          }
        paypal_amount:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/DecimalString" },
                { type: "null" },
              ],
          }
        difference:
          {
            oneOf:
              [
                { $ref: "#/components/schemas/DecimalString" },
                { type: "null" },
              ],
          }
        status: { type: string, enum: [open, resolved] }
        first_run_id: { type: string, format: uuid }
        last_run_id: { type: string, format: uuid }
        resolved_at: { type: [string, "null"], format: date-time }
        resolved_run_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        detail:
          {
            type: object,
            additionalProperties: { type: [string, number, boolean, "null"] },
          }
    ReconciliationRun:
      type: object
      required:
        [
          id,
          trigger,
          status,
          paypal_environment,
          started_at,
          finished_at,
          counts,
          totals,
          trial_balance,
        ]
      properties:
        id: { type: string, format: uuid }
        trigger: { type: string }
        status: { type: string }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        counts:
          type: object
          additionalProperties: { type: integer }
          description: orders, captures, refunds, payouts, new_exceptions, open_exceptions, resolved_exceptions, unverifiable
        totals:
          type: object
          description: Per currency, then captures, refunds and payouts, each with stoat and paypal Decimal strings.
          additionalProperties: { type: object, additionalProperties: true }
        trial_balance:
          {
            type: array,
            items: { $ref: "#/components/schemas/TrialBalanceRow" },
          }
        exceptions:
          {
            type: array,
            items: { $ref: "#/components/schemas/ReconciliationException" },
          }
    AnalyticsDatasetPage:
      type: object
      required: [dataset, paypal_environment, columns, rows, next_cursor]
      properties:
        dataset: { type: string }
        paypal_environment: { $ref: "#/components/schemas/PayPalEnvironment" }
        columns:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: { type: string }
              type:
                {
                  type: string,
                  description: "money columns are returned as Decimal strings",
                }
        rows:
          {
            type: array,
            maxItems: 500,
            items: { type: object, additionalProperties: true },
          }
        next_cursor: { type: [string, "null"] }
    WalletErrorCode:
      type: string
      description: >-
        Values of error.code on wallet routes. 400: VALIDATION_FAILED (details.field and, where
        relevant, details.reason such as EXCEEDS_AVAILABLE, EXCEEDS_REMAINDER, EXCEEDS_MAX_DEPOSIT,
        TOO_MANY_DECIMALS, INVALID_AMOUNT). 403: FORBIDDEN_ACTION (agent principal or wrong role),
        WALLET_NOT_OWNED. 404: NOT_FOUND. 409: IDEMPOTENCY_CONFLICT, WALLET_NOT_ENABLED,
        WALLET_BLOCKED, WALLET_ENVIRONMENT_MISMATCH, WALLET_OWNER_UNRESOLVED, MISSION_NOT_OPEN,
        MISSION_NOT_AWAITING_DECISION, REFUND_EXCEEDS_CAPTURES,
        REFUND_NOTHING_TO_RETRY, ALREADY_REVERSED, RECONCILIATION_IN_PROGRESS, FUNDING_MODE_BUSY.
        422/502/503: PAYPAL_REQUEST_REJECTED (422 for a PayPal 4xx, 502 for a 5xx), PAYPAL_AUTH_FAILED, PAYPAL_UNREACHABLE, PAYPAL_TIMEOUT, PAYPAL_BAD_RESPONSE, PAYPAL_NOT_CONFIGURED (503), LLM_NOT_CONFIGURED (503).
      enum:
        - VALIDATION_FAILED
        - FORBIDDEN_ACTION
        - WALLET_NOT_OWNED
        - NOT_FOUND
        - IDEMPOTENCY_CONFLICT
        - WALLET_NOT_ENABLED
        - WALLET_BLOCKED
        - WALLET_ENVIRONMENT_MISMATCH
        - WALLET_OWNER_UNRESOLVED
        - MISSION_NOT_OPEN
        - MISSION_NOT_AWAITING_DECISION
        - REFUND_EXCEEDS_CAPTURES
        - REFUND_NOTHING_TO_RETRY
        - ALREADY_REVERSED
        - RECONCILIATION_IN_PROGRESS
        - FUNDING_MODE_BUSY
        - PAYPAL_REQUEST_REJECTED
        - PAYPAL_AUTH_FAILED
        - PAYPAL_UNREACHABLE
        - PAYPAL_TIMEOUT
        - PAYPAL_BAD_RESPONSE
        - PAYPAL_NOT_CONFIGURED
        - LLM_NOT_CONFIGURED
    SignupRequest:
      type: object
      required: [email, password, organization_name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        organization_name: { type: string, minLength: 1, maxLength: 120 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    AgentLoginRequest:
      type: object
      required: [agent_id, secret]
      properties:
        agent_id: { type: string, format: uuid }
        secret: { type: string, writeOnly: true }
    ProvisionAgentRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { type: string, enum: [buyer, provider] }
    PublishServiceRequest:
      type: object
      required: [name, description, category, unit_price, currency, unit]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        category: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
        unit_price: { $ref: "#/components/schemas/Amount" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        unit: { type: string, minLength: 1, maxLength: 40 }
        min_price:
          $ref: "#/components/schemas/Amount"
          description: Optional private negotiation floor; never returned to buyers.
        execution_mode:
          type: string
          enum: [hosted, external]
          default: external
          description: hosted = Stoat runs the model review once the deal is ready (accepted, or paid when funding is required); external = the provider agent delivers through POST /artifacts and POST /deliveries.
    Amount:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
      description: Positive decimal string; currency precision validated separately.
      examples: ["0.12", "10.00"]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { $ref: "#/components/schemas/Amount" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code: { type: string }
            message: { type: string }
            correlation_id: { type: string }
            details: { type: object }
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Forbidden action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Invalid or expired credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Policy or semantic validation failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
