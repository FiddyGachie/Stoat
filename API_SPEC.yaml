openapi: 3.1.0
info:
  title: Stoat API
  version: 2.1.0
  description: Verified-delivery economic lifecycle API. Amounts are decimal strings. All real money movement is PayPal (Orders v2 collection, Payouts disbursement).
servers:
  - url: https://api.example.invalid/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        "200": { description: Healthy }
  /auth/signup:
    post:
      security: []
      summary: Create an organization buyer account and initial buyer agent
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201": { description: Account created }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      security: []
      summary: Authenticate an organization user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Access token issued }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/agent/login:
    post:
      security: []
      summary: Authenticate an owner-provisioned agent
      operationId: loginAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentLoginRequest" }
      responses:
        "200": { description: Agent access token issued }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      summary: Get the authenticated principal
      operationId: getCurrentPrincipal
      responses:
        "200": { description: Authenticated user or agent }
  /missions:
    post:
      summary: Create mission
      operationId: createMission
      responses:
        "201": { description: Created }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      summary: List missions
      operationId: listMissions
      responses:
        "200": { description: Mission page }
  /missions/{missionId}:
    get:
      summary: Get mission
      parameters: [{ $ref: "#/components/parameters/MissionId" }]
      responses:
        "200": { description: Mission }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit an open mission (title, brief, budget)
      description: >-
        Human owner (the user who owns the mission's buyer agent) or Admin only. Only status
        'created'. The budget cannot go below what is already reserved or charged
        (409 BUDGET_BELOW_COMMITTED). Moves no money.
      parameters: [{ $ref: "#/components/parameters/MissionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                brief: { type: string, maxLength: 5000 }
                budget: { $ref: "#/components/schemas/DecimalString" }
      responses:
        "200": { description: The updated mission }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Delete an open mission (soft delete; history is kept)
      description: >-
        Human owner or Admin only. Status becomes 'deleted' and the mission leaves lists; open
        quotes are withdrawn. Refused while a provider is working (MISSION_HAS_LIVE_WORK) or funds
        are reserved (MISSION_HAS_RESERVATION). Completed missions cannot be deleted.
      parameters: [{ $ref: "#/components/parameters/MissionId" }]
      responses:
        "200": { description: "{ id, status: deleted, withdrawn_quotes }" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /missions/{missionId}/replay:
    post:
      summary: Replay a completed mission at half the last final spend
      description: >-
        Human owner or Admin only. Creates a new mission (replay_of = this one) with a budget of
        half the last spend (rounded down to cents, at least 0.01), requests a quote from the same
        service with the same scope, and runs the buyer agent's negotiation toward that budget.
        The provider's price floor is respected and nothing is accepted automatically. If the
        model cannot run, negotiation_error explains why and the quote stays open.
      parameters: [{ $ref: "#/components/parameters/MissionId" }]
      responses:
        "201": { description: "{ mission, replay_of, last_spend, target_budget, quote, negotiation, negotiation_error }" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "MISSION_NOT_COMPLETED or MISSION_HAS_NO_RESULT" }
  /mission-results:
    get:
      summary: Archived mission results (append-only, kept for future reference)
      description: >-
        Human owner (own missions) or Admin (tenant). One record per verified agreement, written when
        its mission completes and backfilled for older completed missions on first read.
      parameters:
        - { name: mission_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: "{ results: [...] }" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /missions/{missionId}/quotes:
    get:
      summary: List persisted quotes for a mission
      operationId: listMissionQuotes
      parameters: [{ $ref: "#/components/parameters/MissionId" }]
      responses:
        "200": { description: Mission quote history }
        "404": { $ref: "#/components/responses/NotFound" }
  /services:
    get:
      summary: Discover services
      operationId: discoverServices
      responses:
        "200": { description: Service page }
    post:
      summary: Publish a fixed-unit service as the authenticated provider agent
      operationId: publishService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishServiceRequest" }
      responses:
        "201": { description: Service published }
        "403": { $ref: "#/components/responses/Forbidden" }
  /agents:
    get:
      summary: List authorized agents
      operationId: listAgents
      responses:
        "200": { description: Agent page }
    post:
      summary: Provision a buyer or provider agent for the organization
      operationId: provisionAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionAgentRequest" }
      responses:
        "201": { description: Agent and one-time credential returned }
        "403": { $ref: "#/components/responses/Forbidden" }
  /quotes:
    post:
      summary: Request quote
      operationId: requestQuote
      responses:
        "201": { description: Quote request created }
  /quotes/{quoteId}/accept:
    post:
      summary: Accept quote subject to policy and reservation
      operationId: acceptQuote
      parameters:
        [
          {
            name: quoteId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        "200": { description: Agreement accepted }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /deliveries:
    post:
      summary: Submit delivery referencing controlled artifact_id
      operationId: submitDelivery
      responses:
        "201": { description: Delivery submitted }
  /deliveries/{deliveryId}:
    get:
      summary: Get delivery and verification
      responses:
        "200": { description: Delivery }
  /deliveries/{deliveryId}/revision:
    post:
      summary: Request bounded revision
      responses:
        "202": { description: Revision queued }
        "409": { $ref: "#/components/responses/Conflict" }
  /artifacts:
    post:
      summary: Upload controlled artifact
      responses:
        "201": { description: Artifact ID and checksum }
  /obligations:
    get:
      summary: List obligations
      responses:
        "200": { description: Obligation page }
  /settlement/batches:
    post:
      summary: Propose settlement batch
      responses:
        "201": { description: Batch proposed }
  /settlement/batches/{batchId}/approve:
    post:
      summary: Human-only batch approval
      responses:
        "200": { description: Approved }
        "403": { $ref: "#/components/responses/Forbidden" }
  /settlement/batches/{batchId}/paypal/create-order:
    post:
      summary: Create the PayPal order for an approved batch whose agreements were not paid at acceptance (409 BATCH_ALREADY_FUNDED otherwise)
      responses:
        "201": { description: PayPal order created }
  /settlement/batches/{batchId}/paypal/capture:
    post:
      summary: Capture after buyer approval (body order_id); PayPal refuses with PAYPAL_ORDER_NOT_APPROVED until the buyer approves
      responses:
        "200": { description: Capture result, reconciled against the batch }
  /webhooks/paypal:
    post:
      security: []
      summary: Verify and process PayPal webhook
      responses:
        "200": { description: Accepted / duplicate safely handled }
        "400": { description: Invalid webhook }
  /integrity:
    get:
      summary: Compute live financial and event invariants
      responses:
        "200": { description: Integrity report }
  /agents/runs:
    get:
      summary: List authorized agent runs
      responses:
        "200": { description: Agent run page }
  /agents/runs/{runId}:
    get:
      summary: Get agent run trace
      responses:
        "200": { description: Agent run }
  # ── v2.1: PayPal-only money movement ─────────────────────────────────────
  # Every payment, capture, refund and payout is a PayPal operation. No request may carry a
  # "provider" field on these routes: it is rejected with 400 PROVIDER_NOT_ACCEPTED.
  /paypal/status:
    get:
      summary: PayPal configuration and independent Orders / Payouts capability status
      description: Reports orders and payouts capability (enabled, blocked, unknown, degraded). Never returns credentials or scopes.
      responses:
        "200": { description: Status }
  /payments/due:
    get:
      summary: Payments waiting for the signed-in person to approve at PayPal
      description: Human sessions only. Agent principals receive 403.
      responses:
        "200": { description: Payments awaiting approval }
        "403": { description: Agent principal }
  /agreements/{agreementId}/payment:
    parameters:
      - {
          name: agreementId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: Latest PayPal collection for an agreement
      description: Human sessions only. Agent principals receive 403.
      responses:
        "200": { description: Payment or null }
    post:
      summary: Create (or reuse) the PayPal Orders v2 order that collects the agreement price
      description: Human sessions only. Agent principals receive 403.
      responses:
        "200": { description: Payment with approve_url }
        "503": { description: PAYPAL_NOT_CONFIGURED }
  /payments/{paymentId}/refresh:
    parameters:
      - {
          name: paymentId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Ask PayPal where a payment stands now; captures it if the buyer approved
      description: Human sessions only. Agent principals receive 403.
      responses:
        "200": { description: Payment }
        "404": { description: Not found in this tenant }
  /agreements/{agreementId}/refund:
    parameters:
      - {
          name: agreementId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Refund funded money through PayPal while no obligation exists for the agreement
      description: Operator or supervisor sessions only.
      responses:
        "200": { description: Refunded payment }
        "409": { description: FUNDS_ALLOCATED }
  /agreements/{agreementId}/result:
    parameters:
      - {
          name: agreementId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: The verified work the provider delivered, with every attempt and the verifier reasons
      description: >-
        Readable by the agreement's buyer agent, its provider agent, the buyer agent's owner, and
        operators or supervisors. Anyone else gets 404. result is null until a delivery is verified.
        result carries the provider model's summary, files_reviewed and findings (each with a
        recommendation), sorted by severity. Nothing is rewritten by Stoat.
      responses:
        "200":
          {
            description: "agreement, mission, provider, obligation, result, attempts",
          }
        "404": { description: Not found or not visible to this principal }
  /settlement/treasury-plan:
    post:
      summary: The treasury agent (a real model call) proposes settlement batches and the PayPal route for each
      description: >-
        Human sessions only (buyer, operator or supervisor); agent principals receive 403. The model
        reads payable, unbatched obligations and picks release_collected_funds (the buyer already
        paid through PayPal) or collect_via_paypal_order. Deterministic checks reject unknown ids,
        mixed currencies, mixed collected and uncollected work, a route that does not match what
        PayPal captured, and any obligation left unaccounted for; one corrective retry, then fail
        closed. Created batches are approval_required: a person approves, releases or collects, and
        separately approves payouts.
      responses:
        "200":
          {
            description: "run_id, model, mode, replayed, summary, batches[{batch_id, route, rationale, next_action}], excluded",
          }
        "403": { description: Agent principals cannot ask for a plan }
        "422":
          {
            description: "AGENT_OUTPUT_INVALID: the plan failed the checks; no batch was created",
          }
        "503": { description: "LLM_NOT_CONFIGURED" }
  /settlement/batches/{batchId}/release-funded:
    parameters:
      - {
          name: batchId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Settle an approved batch from money already collected at acceptance (no second charge)
      description: Human sessions only. Agent principals receive 403.
      responses:
        "200": { description: Batch confirmed }
  /agents/{agentId}/payout-account:
    parameters:
      - {
          name: agentId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    put:
      summary: Set a provider agent's PayPal recipient (encrypted at rest)
      description: Human sessions only. Requires consent=true. The value is never returned; only a mask is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paypal_email, consent]
              properties:
                paypal_email: { type: string, format: email }
                consent: { type: boolean }
      responses:
        "200": { description: Masked recipient, verification_status pending }
        "400": { description: Invalid email or missing consent }
    get:
      summary: Masked recipient and verification status
      description: Human sessions only. Agent principals receive 403.
      responses:
        "200": { description: Masked recipient or null }
  /agents/{agentId}/payout-account/verify:
    parameters:
      - {
          name: agentId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: A person confirms the masked recipient is correct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_masked]
              properties:
                confirm_masked: { type: string }
      responses:
        "200": { description: Recipient verified }
        "400": { description: Confirmation does not match }
  /settlement/batches/{batchId}/payouts:
    parameters:
      - {
          name: batchId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: Providers in a batch with masked recipient, status and latest payout
      description: Human sessions only. Agent principals receive 403.
      responses:
        "200": { description: Providers }
    post:
      summary: Send the approved PayPal payouts (Payouts API)
      description: |
        Requires an unused, unexpired approval from POST payout-approval. Re-checks recipient hash,
        obligation set, amount and currency. 503 PAYPAL_PAYOUTS_UNAVAILABLE when the capability is not enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id]
              properties:
                approval_id: { type: string, format: uuid }
      responses:
        "200":
          {
            description: Payouts and per-provider errors; replayed=true when the approval was already used,
          }
        "403":
          {
            description: Approval missing,
            expired,
            or the recipient or amount changed (recorded as a substitution attempt),
          }
        "503": { description: PAYPAL_PAYOUTS_UNAVAILABLE }
  /settlement/batches/{batchId}/payout-approval:
    parameters:
      - {
          name: batchId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Approve a provider payout (separate from collection approval)
      description: Binds amount, currency, obligation ids hash, recipient snapshot hash and policy version. One-time, expires in 15 minutes.
      responses:
        "201": { description: Approval with masked recipients }
        "422": { description: PAYOUT_ACCOUNT_MISSING or batch not confirmed }
        "503": { description: PAYPAL_PAYOUTS_UNAVAILABLE }
  /payouts/{payoutId}/refresh:
    parameters:
      - {
          name: payoutId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Query PayPal for the payout item and apply its status
      description: A payout is paid only when PayPal reports the item SUCCESS. UNCLAIMED, PENDING and ONHOLD are not paid.
      responses:
        "200": { description: Payout }
  /money-flow:
    get:
      summary: Agreements with their buyer-collection and provider-disbursement legs
      description: Human sessions only. Agent principals receive 403.
      responses:
        "200":
          description: Flows and the payouts capability
          content:
            application/json:
              schema:
                type: object
                properties:
                  payouts_capability:
                    type: object
                    properties:
                      status:
                        {
                          type: string,
                          enum: [enabled, blocked, unknown, degraded],
                        }
                      enabled: { type: boolean }
                      reason: { type: [string, "null"] }
                  flows: { type: array, items: { type: object } }
  /missions/{missionId}/negotiate:
    parameters:
      - {
          name: missionId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      summary: Buyer agent compares open offers and may counteroffer (real model call)
      description: |
        The model proposes; deterministic validation decides. Returns the comparison, each counteroffer with its
        deterministic verdict and reason codes, and a server-built selection. 503 LLM_NOT_CONFIGURED without a model key.
      responses:
        "200": { description: Negotiation result }
        "422": { description: AGENT_OUTPUT_INVALID }
  /missions/{missionId}/proposals:
    parameters:
      - {
          name: missionId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      summary: Stored commercial proposals (comparison, counteroffers, selection) with prompt hash and model id
      responses:
        "200": { description: Proposals }
  # ── v2.1 Mission budget wallet ───────────────────────────────────────────
  # Money-boundary rules for every /wallet, /notifications, /analytics/wallet and /admin wallet route:
  #  * Human sessions only. An agent principal receives 403 FORBIDDEN_ACTION and one audit row.
  #  * Every amount is a Decimal string (never a JSON number). Currency is an ISO 4217 code.
  #  * The wallet, owner and tenant come from the authenticated principal. A wallet_id, owner_id,
  #    user_id or tenant_id in a body is ignored.
  #  * No request or response carries a recipient, payee, payment-source or credential field. A
  #    request that names one is rejected with 400 VALIDATION_FAILED.
  #  * Every state-changing money POST needs an Idempotency-Key header (1 to 200 characters).
  /admin/funding-mode:
    get:
      summary: Tenant funding mode (direct or wallet)
      description: Operator or supervisor sessions only.
      operationId: getFundingMode
      responses:
        "200":
          description: Current mode
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundingModeResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      summary: Switch the tenant funding mode
      description: >-
        Operator or supervisor sessions only. Refused with 409 FUNDING_MODE_BUSY while any agreement
        accepted under the old mode is still live (accepted, revision_requested, needs_review).
      operationId: setFundingMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [funding_mode]
              properties:
                funding_mode: { $ref: "#/components/schemas/FundingMode" }
      responses:
        "200":
          description: Mode after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundingModeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /wallet:
    get:
      summary: The signed-in person's wallets (one per currency), funding mode and PayPal environment
      operationId: getWallet
      responses:
        "200":
          description: Wallets with Decimal-string balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletOverview" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create the signed-in person's wallet for one supported currency (idempotent, moves no money)
      operationId: createWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency: { type: string, pattern: "^[A-Za-z]{3}$" }
      responses:
        "201":
          description: The wallet (existing one when already created)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /wallet/account:
    get:
      summary: The signed-in person's account view (wallets, deposits, reservations, charges, refunds)
      operationId: getWalletAccount
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /wallet/statement:
    get:
      summary: Statement of the signed-in person's wallet, newest activity with running balance
      description: Name `currency` when the person has more than one wallet (400 VALIDATION_FAILED otherwise). No wallet yet returns an empty statement with balance "0".
      operationId: getWalletStatement
      parameters:
        - {
            name: currency,
            in: query,
            required: false,
            schema: { type: string, pattern: "^[A-Za-z]{3}$" },
          }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Statement page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /wallet/deposits:
    get:
      summary: Deposits (Owner's own; an Admin sees the tenant), newest first, at most 100
      operationId: listDeposits
      responses:
        "200":
          description: Deposits
          content:
            application/json:
              schema:
                type: object
                required: [paypal_environment, deposits]
                properties:
                  paypal_environment:
                    { $ref: "#/components/schemas/PayPalEnvironment" }
                  deposits:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Deposit" },
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a PayPal Orders v2 deposit that funds the signed-in person's wallet
      description: >-
        Returns the deposit with an approve_url while status is awaiting_approval. The wallet is
        credited only after PayPal confirms the capture. The same Idempotency-Key with the same body
        returns the same deposit; the same key with a different body is 409 IDEMPOTENCY_CONFLICT.
        Amount above the configured maximum is 400 VALIDATION_FAILED (reason EXCEEDS_MAX_DEPOSIT).
        409 WALLET_NOT_ENABLED when the tenant funding mode is direct.
      operationId: createDeposit
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositRequest" }
      responses:
        "201":
          description: Deposit created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deposit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502":
          {
            description: "PayPal rejected or could not complete the call (PAYPAL_REQUEST_REJECTED, PAYPAL_UNREACHABLE, PAYPAL_TIMEOUT, PAYPAL_BAD_RESPONSE)",
          }
        "503": { description: PAYPAL_NOT_CONFIGURED }
  /wallet/deposits/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      summary: One deposit (its Owner, or an Admin of the tenant)
      description: Another tenant's deposit answers 404; another Owner's deposit in the same tenant answers 403 WALLET_NOT_OWNED.
      operationId: getDeposit
      responses:
        "200":
          description: Deposit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deposit" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wallet/deposits/{id}/refresh:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    post:
      summary: Ask PayPal where the deposit stands now and apply it (captures when the buyer approved)
      operationId: refreshDeposit
      responses:
        "200":
          description: Deposit after the sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deposit" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wallet/missions:
    get:
      summary: Missions with their wallet funding view (Owner's own; an Admin sees the tenant), at most 100
      operationId: listWalletMissions
      responses:
        "200":
          description: Missions
          content:
            application/json:
              schema:
                type: object
                required: [missions]
                properties:
                  missions:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/MissionWallet" },
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
  /wallet/missions/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      summary: Wallet funding view of one mission (its Owner, or an Admin of the tenant)
      operationId: getWalletMission
      responses:
        "200":
          description: Mission funding view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionWallet" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wallet/missions/{id}/complete:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    post:
      summary: The Owner marks the mission complete; unreserved funds become the Remainder awaiting a decision
      description: Owner only (an Admin cannot complete on an Owner's behalf). Nothing is refunded by completing.
      operationId: completeWalletMission
      responses:
        "200":
          description: Mission funding view after completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionWallet" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /wallet/missions/{id}/remainder-prompt:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      summary: Budget advisor text for the Remainder decision (display only)
      description: >-
        Owner only. 409 MISSION_NOT_AWAITING_DECISION unless the mission state is awaiting_decision.
        The text is model-generated when a model key is configured and valid; otherwise fixed text
        with ai_generated=false. The figures are server values; nothing here moves money.
      operationId: getRemainderPrompt
      responses:
        "200":
          description: Advice with server figures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemainderPrompt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /wallet/missions/{id}/top-up:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    post:
      summary: Create a PayPal deposit that tops up an open mission
      description: >-
        Owner only. Currency defaults to the wallet currency; another currency is 400 VALIDATION_FAILED.
        409 MISSION_NOT_OPEN once the mission is complete.
      operationId: topUpMission
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Amount" }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "201":
          description: Deposit created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deposit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /wallet/missions/{id}/remainder-decision:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    post:
      summary: The Owner decides the Remainder - refund it to PayPal or keep it in the wallet
      description: >-
        Owner only; Idempotency-Key required. A person chooses; nothing is preselected. `amount` must
        not exceed the Remainder (400 VALIDATION_FAILED, reason EXCEEDS_REMAINDER). Refunds go back to
        the original PayPal captures; 409 REFUND_EXCEEDS_CAPTURES when they cannot cover it.
        409 MISSION_NOT_AWAITING_DECISION when no Remainder is waiting.
      operationId: decideRemainder
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [refund, keep] }
                amount: { $ref: "#/components/schemas/Amount" }
      responses:
        "200":
          description: Decision with the refund it started, if any
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemainderDecision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /wallet/refunds:
    get:
      summary: Refunds (Owner's own; an Admin sees the tenant), newest first, at most 100
      operationId: listWalletRefunds
      responses:
        "200":
          description: Refunds
          content:
            application/json:
              schema:
                type: object
                required: [paypal_environment, refunds]
                properties:
                  paypal_environment:
                    { $ref: "#/components/schemas/PayPalEnvironment" }
                  refunds:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Refund" },
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Refund unlinked wallet funds (not tied to a mission) back to PayPal
      description: >-
        Owner only; Idempotency-Key required. The wallet is the caller's own, picked by `currency`
        (required when the caller has several). Amount above the Available_Balance is 400
        VALIDATION_FAILED (reason EXCEEDS_AVAILABLE); above what the original captures can return is
        409 REFUND_EXCEEDS_CAPTURES.
      operationId: createWalletRefund
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/Amount" }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /wallet/refunds/{id}:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    get:
      summary: One refund with its per-capture items (its Owner, or an Admin of the tenant)
      operationId: getWalletRefund
      responses:
        "200":
          description: Refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /wallet/refunds/{id}/retry:
    parameters:
      - { $ref: "#/components/parameters/IdPath" }
    post:
      summary: Retry the failed items of a refund
      description: Idempotency-Key required. 409 REFUND_NOTHING_TO_RETRY when no item failed. Owner or Admin of the tenant.
      operationId: retryWalletRefund
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Refund after the retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /wallet/events:
