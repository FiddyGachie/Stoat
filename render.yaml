# Render Blueprint — Stoat v2.0
# Docs: https://render.com/docs/blueprint-spec
#
# Resources defined here:
#   1. stoat-db       — Render Postgres (managed PostgreSQL)
#   2. stoat-api      — Web Service (Express API + migrations)
#   3. stoat-worker   — Background Worker (PostgreSQL job worker)
#   4. stoat-console  — Static Site (React operator console)
#
# Deploy: connect this repo in the Render Dashboard → New → Blueprint.
# Secrets with sync: false are prompted at first deploy and never committed.

databases:
  - name: stoat-db
    plan: free              # upgrade to starter/standard for production
    postgresMajorVersion: "16"
    # databaseName and user are auto-generated by Render from the name above.
    # The internal connection string is injected into stoat-api via fromDatabase below.

services:
  # ── API Web Service ─────────────────────────────────────────────────────────
  - name: stoat-api
    type: web
    runtime: node
    plan: free              # upgrade to starter for production (free spins down after 15 min)
    region: oregon          # match your Postgres region — must be the same for internal URL
    branch: main
    buildCommand: npm install && npm run build
    # preDeployCommand runs after build, before start — used for DB migrations.
    # Render runs this once per deploy instance; it's the right place for migrate.
    preDeployCommand: node dist/src/db/migrate-entrypoint.js
    startCommand: npm start
    healthCheckPath: /v1/health
    # Render default port is 10000; our app reads PORT env var.
    envVars:
      # ── Database ─────────────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: stoat-db
          property: connectionString   # injects the internal Postgres URL automatically

      # ── App ──────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"                 # Render's default — must match what Express binds to
      - key: APP_BASE_URL
        fromService:
          name: stoat-api
          type: web
          property: host               # https://stoat-api.onrender.com

      # ── Auth — set these as secrets in the Render Dashboard ──────────────
      - key: JWT_SECRET
        sync: false                    # prompted at first deploy; never stored in YAML
      - key: JWT_ISSUER
        value: stoat-render
      - key: JWT_AUDIENCE
        value: stoat-api

      # ── LLM Provider ────────────────────────────────────────────────────
      - key: LLM_PROVIDER
        value: fireworks
      - key: FIREWORKS_API_KEY
        sync: false                    # secret — enter in Render Dashboard
      - key: LLM_MODEL_AGENT
        value: accounts/fireworks/models/llama-v3p3-70b-instruct
      - key: LLM_MODEL_FAST
        value: accounts/fireworks/models/llama-v3p1-8b-instruct
      - key: LLM_MODE
        value: replay                  # safe default; change to live once API key is set

      # ── Agent runtime limits ─────────────────────────────────────────────
      - key: AGENT_MAX_STEPS
        value: "12"
      - key: AGENT_MAX_SECONDS
        value: "90"
      - key: AGENT_MAX_COST_USD
        value: "0.25"

      # ── PayPal Sandbox ───────────────────────────────────────────────────
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_RETURN_URL
        value: https://stoat-api.onrender.com/v1/paypal/return  # update after first deploy
      - key: PAYPAL_CANCEL_URL
        value: https://stoat-api.onrender.com/v1/paypal/cancel
      - key: PAYPAL_SIMULATED
        value: "false"

      # ── Observability ────────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: info
      - key: DEMO_MODE
        value: "true"

  # ── Background Worker ───────────────────────────────────────────────────────
  - name: stoat-worker
    type: worker
    runtime: node
    plan: free
    region: oregon          # same region as stoat-api and stoat-db
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stoat-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

  # ── Operator Console (Static Site) ──────────────────────────────────────────
  - name: stoat-console
    type: static
    branch: main
    buildCommand: npm install && npm run console:build
    staticPublishPath: dist/console
    # The console proxies /v1 requests to the API at runtime via the browser;
    # the VITE_API_BASE_URL is baked in at build time.
    envVars:
      - key: VITE_API_BASE_URL
        value: https://stoat-api.onrender.com
      - key: VITE_LLM_MODE
        value: replay
      - key: VITE_PAYPAL_SIMULATED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html     # SPA client-side routing fallback

