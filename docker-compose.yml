services:
  postgres:
    image: postgres:16-alpine
    container_name: stoat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stoat
      POSTGRES_PASSWORD: stoatpassword
      POSTGRES_DB: stoat
    ports:
      - "5432:5432"
    volumes:
      - stoat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoat -d stoat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stoat_pgdata:
